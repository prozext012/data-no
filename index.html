<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Buku Nomor HP — Arsip Akun</title>

<!-- PWA: manifest wajib ada & bisa diakses supaya Chrome memunculkan opsi Install -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A63E1C">
<meta name="background-color" content="#F4ECD8">

<!-- Android/Chrome icon fallback -->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

<!-- iOS: Safari tidak memakai manifest icons, harus pakai tag ini sendiri -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buku Nomor HP">

<!-- Windows tile fallback -->
<meta name="msapplication-TileColor" content="#A63E1C">
<meta name="msapplication-TileImage" content="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4ECD8;
    --card:#FFFBF2;
    --ink:#2B2420;
    --ink-soft:#8A7A5C;
    --line:#DCC9A0;
    --burnt:#D2552A;
    --burnt-deep:#A63E1C;
    --mustard:#E8A33D;
    --teal:#2F6E6A;
    --teal-deep:#234F4C;
    --danger:#B33D3D;
    --danger-soft:#F6E2DD;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  button{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:460px; margin:0 auto; padding-bottom:110px; min-height:100vh;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:22px 20px 10px;
    border-bottom:1px solid transparent;
  }
  .topbar h1{
    font-family:'Bungee', cursive; font-weight:700; font-size:22px;
    color:var(--burnt-deep); letter-spacing:-0.01em;
  }
  .topbar p{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .icon-btn{
    width:38px; height:38px; border-radius:12px; border:2px solid var(--ink);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn svg{width:18px; height:18px; stroke:var(--burnt-deep);}
  .icon-btn:active{background:var(--danger-soft);}

  /* ---------- Summary ---------- */
  .summary{
    padding:6px 20px 14px; display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .summary-main{display:flex; align-items:baseline; gap:7px;}
  .summary-main .num{font-family:'Bungee', cursive; font-size:26px; font-weight:600; color:var(--burnt);}
  .summary-main .label{font-size:12.5px; color:var(--ink-soft);}
  .storage-status{font-size:11px; color:var(--ink-soft); text-align:right; max-width:130px; line-height:1.35;}
  .storage-status.warn{color:var(--danger);}
  .storage-status::before{content:"●"; margin-right:4px; font-size:8px; color:#4C9A6A; position:relative; top:-1px;}
  .storage-status.warn::before{color:var(--danger);}

  /* ---------- Search + Filter ---------- */
  .search-wrap{padding:14px 20px 8px; display:flex; gap:9px;}
  .search-box{
    display:flex; align-items:center; gap:9px; flex:1; min-width:0;
    background:var(--card); border:2px solid var(--ink); border-radius:12px;
    padding:10px 13px;
  }
  .search-box svg{width:16px; height:16px; stroke:var(--ink-soft); flex-shrink:0;}
  .search-box input{
    border:none; outline:none; background:transparent; flex:1; min-width:0;
    font-family:'Inter', sans-serif; font-size:14px; color:var(--ink);
  }
  .search-box input::placeholder{color:#B5A788;}
  .filter-btn{
    position:relative; width:42px; height:42px; border-radius:12px; border:2px solid var(--ink);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .filter-btn svg{width:17px; height:17px; stroke:var(--burnt-deep);}
  .filter-btn.active{background:var(--teal); border-color:var(--ink);}
  .filter-btn.active svg{stroke:#fff;}
  .filter-badge{
    position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; border-radius:9px;
    background:var(--burnt); color:#fff; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .filter-badge[hidden]{display:none;}

  /* ---------- Ledger ---------- */
  .ledger{padding:4px 20px 0;}
  .row{
    display:flex; gap:11px; padding:14px 2px; border-bottom:1px solid var(--line);
    position:relative; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    transition:background .15s ease;
  }
  .row.today{border-left:4px solid var(--mustard); padding-left:8px; margin-left:-12px;}
  .row.pressed{background:var(--danger-soft);}
  .row-no{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft);
    width:26px; flex-shrink:0; padding-top:2px;
  }
  .row-main{flex:1; min-width:0; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .row-left{min-width:0;}
  .row-username{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:14.5px;
    color:var(--ink); word-break:break-all; line-height:1.3;
  }
  .row-phone{
    font-family:'JetBrains Mono', monospace; font-size:13.5px; color:var(--burnt);
    margin-top:2px; word-break:break-all; line-height:1.3;
  }
  .row-when{text-align:right; flex-shrink:0;}
  .row-date{font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
  .row-time{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:#B5A788; white-space:nowrap; margin-top:2px;}

  /* ---------- Empty state ---------- */
  .empty-state{padding:60px 30px; text-align:center;}
  .empty-state svg{width:40px; height:40px; stroke:var(--ink-soft); margin-bottom:14px;}
  .empty-state p{font-size:14px; color:var(--ink); font-weight:600;}
  .empty-state p.sub{font-size:12.5px; color:var(--ink-soft); font-weight:400; margin-top:5px;}

  /* ---------- FAB ---------- */
  .fab-wrap{
    position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(244,236,216,0) 0%, var(--paper) 45%);
  }
  .fab{
    width:100%; max-width:420px; background:var(--burnt); color:#fff; border:none;
    border-radius:12px; padding:15px; font-family:'Inter', sans-serif; font-size:14.5px; font-weight:700; border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
  }
  .fab svg{width:17px; height:17px; stroke:#fff;}
  .fab:active{background:var(--burnt-deep); transform:scale(.98);}

  /* ---------- Overlay / sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(32,40,62,0.42); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:460px; background:var(--paper); border-radius:10px 10px 0 0; border-top:1px solid var(--line);
    padding:10px 22px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(16px); transition:transform .2s ease;
    max-height:88vh; overflow-y:auto;
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:6px auto 16px;}
  .sheet h2{font-family:'Bungee', cursive; font-size:18px; font-weight:600; color:var(--burnt-deep); margin-bottom:16px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input{
    width:100%; padding:12px 13px; border:2px solid var(--ink); border-radius:10px;
    background:var(--card); font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--ink);
    outline:none;
  }
  .field input:focus{border-color:var(--burnt);}
  .field input::placeholder{color:#B5A788; font-family:'Inter', sans-serif;}

  .btn-primary{
    width:100%; background:var(--burnt); color:#fff; border:2px solid var(--ink); border-radius:10px;
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; margin-top:4px;
  }
  .btn-primary:active{background:var(--burnt-deep);}
  .btn-ghost{
    width:100%; background:transparent; color:var(--ink-soft); border:none;
    padding:12px; font-size:13.5px; font-weight:500; cursor:pointer; text-align:center;
  }

  .sheet-btn{
    width:100%; display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    background:var(--card); border:2px solid var(--ink); border-radius:10px;
    padding:13px 15px; margin-bottom:9px; cursor:pointer; text-align:left;
  }
  .sheet-btn .title{font-size:14px; font-weight:600; color:var(--ink);}
  .sheet-btn .desc{font-size:11.5px; color:var(--ink-soft);}
  .sheet-btn:active{background:var(--danger-soft);}

  /* ---------- Filter sheet ---------- */
  .filter-group{margin-bottom:18px;}
  .filter-group-title{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:9px; letter-spacing:.01em;}
  .filter-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .filter-chip{
    display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:3px;
    border:2px solid var(--ink); background:var(--card); cursor:pointer; font-size:13px; color:var(--ink);
    -webkit-user-select:none; user-select:none;
  }
  .filter-chip .box{
    width:15px; height:15px; border-radius:4px; border:1.5px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .filter-chip .box svg{width:10px; height:10px; stroke:#fff; display:none;}
  .filter-chip.checked{background:var(--teal); border-color:var(--ink); color:#fff;}
  .filter-chip.checked .box{background:#fff; border-color:var(--ink);}
  .filter-chip.checked .box svg{display:block; stroke:var(--teal-deep);}
  .filter-sheet-actions{display:flex; gap:10px; margin-top:4px;}
  .filter-sheet-actions .btn-primary{margin-top:0;}
  .filter-sheet-actions .btn-reset{
    flex-shrink:0; background:transparent; border:2px solid var(--ink); color:var(--ink);
    border-radius:10px; padding:13px 16px; font-size:13.5px; font-weight:600; cursor:pointer;
  }

  /* ---------- Row action menu (tekan lama) ---------- */
  .action-menu-title{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; word-break:break-all;}
  .action-item{
    width:100%; display:flex; align-items:center; gap:12px; background:var(--card);
    border:2px solid var(--ink); border-radius:10px; padding:14px 15px; margin-bottom:9px;
    cursor:pointer; font-size:14px; font-weight:600; color:var(--ink); text-align:left;
  }
  .action-item svg{width:17px; height:17px; stroke:var(--ink); flex-shrink:0;}
  .action-item.danger{color:var(--danger);}
  .action-item.danger svg{stroke:var(--danger);}
  .action-item:active{background:var(--danger-soft);}

  .confirm-box{
    background:var(--card); border-radius:12px; border:2px solid var(--ink); padding:22px; width:calc(100% - 40px); max-width:360px;
  }
  .confirm-box p{font-size:14.5px; color:var(--ink); margin-bottom:18px; line-height:1.5;}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions button{
    flex:1; padding:11px; border-radius:10px; border:2px solid var(--ink); font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .confirm-actions .cancel{background:var(--paper); color:var(--ink);}
  .confirm-actions .danger{background:var(--danger); color:#fff;}
  #confirmOverlay{align-items:center;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:98px; transform:translate(-50%, 10px);
    background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:10px;
    font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:all .22s ease; z-index:80;
    max-width:86%; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}
  .toast.error{background:var(--danger);}

  /* ---------- Print ---------- */
  .print-only{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printTable, #printTable *{visibility:visible;}
    #printTable{display:table !important; position:absolute; top:0; left:0; width:100%; border-collapse:collapse;}
    #printTable caption{font-family:'Bungee', cursive; font-size:16px; text-align:left; padding-bottom:10px;}
    #printTable th, #printTable td{border:1px solid #999; padding:7px 10px; font-size:11.5px; text-align:left;}
    #printTable th{background:#eee;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <h1>Buku Nomor HP</h1>
      <p>Arsip nomor & akun terdaftar</p>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu backup">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.3"></circle><circle cx="12" cy="12" r="1.3"></circle><circle cx="12" cy="19" r="1.3"></circle></svg>
    </button>
  </div>

  <div class="summary">
    <div class="summary-main">
      <span class="num" id="totalCount">0</span>
      <span class="label">data tersimpan</span>
    </div>
    <div class="storage-status" id="storageStatus">Memeriksa penyimpanan…</div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" id="searchInput" placeholder="Cari username atau nomor HP…" autocomplete="off">
    </div>
    <button class="filter-btn" id="filterBtn" aria-label="Filter">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="18" x2="14" y2="18"></line></svg>
      <span class="filter-badge" id="filterBadge" hidden>0</span>
    </button>
  </div>

  <div class="ledger" id="ledger"></div>

  <div class="empty-state" id="emptyState" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    <p>Belum ada data tersimpan</p>
    <p class="sub">Ketuk "Tambah Data" untuk mencatat nomor HP pertama</p>
  </div>
</div>

<div class="fab-wrap">
  <button class="fab" id="addBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    <span>Tambah Data</span>
  </button>
</div>

<!-- Form sheet (tambah / edit) -->
<div class="overlay" id="formOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="formTitle">Tambah Data</h2>
    <div class="field">
      <label>Nomor HP</label>
      <input type="tel" id="phoneInput" placeholder="0812-3456-7890" inputmode="numeric">
    </div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="usernameInput" placeholder="yanto.ganteng" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label>Tanggal</label>
      <input type="date" id="dateInput">
    </div>
    <button class="btn-primary" id="saveRecordBtn">Simpan Data</button>
    <button class="btn-ghost" id="cancelFormBtn">Batal</button>
  </div>
</div>

<!-- Menu / backup sheet -->
<div class="overlay" id="menuOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Backup Data</h2>
    <button class="sheet-btn" id="backupJsonBtn">
      <span class="title">Unduh Backup (.json)</span>
      <span class="desc">File lengkap untuk dipulihkan lagi nanti</span>
    </button>
    <button class="sheet-btn" id="backupCsvBtn">
      <span class="title">Unduh Excel (.csv)</span>
      <span class="desc">Bisa dibuka di Excel / Google Sheets</span>
    </button>
    <button class="sheet-btn" id="backupPdfBtn">
      <span class="title">Cetak / Simpan PDF</span>
      <span class="desc">Tampilan tabel siap cetak</span>
    </button>
    <button class="sheet-btn" id="importBtn">
      <span class="title">Pulihkan dari Backup</span>
      <span class="desc">Impor file .json hasil backup</span>
    </button>
    <input type="file" id="fileInput" accept="application/json" hidden>
    <button class="btn-ghost" id="closeMenuBtn">Tutup</button>
  </div>
</div>

<!-- Filter sheet -->
<div class="overlay" id="filterOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Filter Data</h2>
    <div class="filter-group">
      <div class="filter-group-title">PERIODE</div>
      <div class="filter-chips" id="periodChips"></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">JAM</div>
      <div class="filter-chips" id="timeChips"></div>
    </div>
    <div class="filter-sheet-actions">
      <button class="btn-reset" id="resetFilterBtn">Reset</button>
      <button class="btn-primary" id="applyFilterBtn">Terapkan Filter</button>
    </div>
  </div>
</div>

<!-- Row action sheet (tekan lama) -->
<div class="overlay" id="rowActionOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Pilih Aksi</h2>
    <div class="action-menu-title" id="rowActionLabel"></div>
    <button class="action-item" id="rowCopyUsernameBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      Salin Username
    </button>
    <button class="action-item" id="rowCopyPhoneBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      Salin Nomor HP
    </button>
    <button class="action-item" id="rowEditBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      Edit Data
    </button>
    <button class="action-item danger" id="rowDeleteBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
      Hapus Data
    </button>
    <button class="btn-ghost" id="rowActionCancelBtn">Batal</button>
  </div>
</div>

<!-- Confirm delete -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmText">Hapus data ini?</p>
    <div class="confirm-actions">
      <button class="cancel" id="confirmCancelBtn">Batal</button>
      <button class="danger" id="confirmOkBtn">Hapus</button>
    </div>
  </div>
</div>

<table id="printTable" class="print-only">
  <caption>Buku Nomor HP — Arsip Akun</caption>
  <thead><tr><th>No</th><th>Username</th><th>Nomor HP</th><th>Tanggal</th></tr></thead>
  <tbody id="printBody"></tbody>
</table>

<div class="toast" id="toast"></div>

<script>
/* ---------- State ---------- */
let records = [];
let editingId = null;
let pendingDeleteId = null;
let activeRowId = null;
let storageMode = null; // 'cloud' | 'local' | null
const STORAGE_KEY = "bukunomorhp:records";
const MONTHS = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

const PERIOD_OPTIONS = [
  {id:'today', label:'Hari ini'},
  {id:'yesterday', label:'Kemarin'},
  {id:'week', label:'7 hari terakhir'},
  {id:'month', label:'Bulan ini'},
];
const TIME_OPTIONS = [
  {id:'pagi', label:'Pagi (00–12)'},
  {id:'siang', label:'Siang (12–18)'},
  {id:'malam', label:'Malam (18–24)'},
];
let selectedPeriods = new Set();
let selectedTimes = new Set();
let appliedPeriods = new Set();
let appliedTimes = new Set();

/* ---------- Helpers ---------- */
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateID(iso){
  if (!iso) return '-';
  const [y,m,d] = iso.split('-').map(Number);
  if (!y || !m || !d) return iso;
  return `${d} ${MONTHS[m-1]} ${y}`;
}
function formatTimeID(iso){
  if (!iso) return '--:--:--';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '--:--:--';
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function digitsOnly(s){ return (s || '').replace(/\D/g,''); }
function uid(){ return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }

function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type==='error' ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(()=> t.classList.remove('show'), 2400);
}

/* ---------- Storage (otomatis, fallback localStorage) ---------- */
function setStorageStatus(ok, msg){
  const el = document.getElementById('storageStatus');
  el.textContent = msg;
  el.className = 'storage-status' + (ok ? '' : ' warn');
}
function localStorageWorks(){
  try{
    window.localStorage.setItem('__bukuhp_test__','1');
    window.localStorage.removeItem('__bukuhp_test__');
    return true;
  }catch(e){ return false; }
}
function waitForCloudStorage(maxWaitMs = 1200){
  return new Promise(resolve=>{
    const start = Date.now();
    (function check(){
      if (window.storage && typeof window.storage.get === 'function'){ resolve(true); return; }
      if (Date.now() - start > maxWaitMs){ resolve(false); return; }
      setTimeout(check, 100);
    })();
  });
}
async function detectStorageMode(){
  const hasCloud = await waitForCloudStorage();
  if (hasCloud){ storageMode = 'cloud'; return; }
  if (localStorageWorks()){ storageMode = 'local'; return; }
  storageMode = null;
}
async function loadRecords(){
  await detectStorageMode();

  if (storageMode === 'cloud'){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      records = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ records = []; }
    setStorageStatus(true, "Tersimpan otomatis (akun)");
    return;
  }
  if (storageMode === 'local'){
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      records = raw ? JSON.parse(raw) : [];
    }catch(e){ records = []; }
    setStorageStatus(true, "Tersimpan di HP ini");
    return;
  }
  records = [];
  setStorageStatus(false, "Penyimpanan tidak tersedia — pakai Backup Data");
}
async function saveRecords(){
  const payload = JSON.stringify(records);

  if (storageMode === 'cloud'){
    for (let attempt=0; attempt<3; attempt++){
      try{
        const result = await window.storage.set(STORAGE_KEY, payload, false);
        if (result){
          setStorageStatus(true, "Tersimpan otomatis (akun)");
          return true;
        }
      }catch(e){ console.error('Gagal simpan cloud', e); }
      await new Promise(r=>setTimeout(r,300));
    }
    setStorageStatus(false, "Backup otomatis gagal — cek koneksi");
    return false;
  }
  if (storageMode === 'local'){
    try{
      window.localStorage.setItem(STORAGE_KEY, payload);
      setStorageStatus(true, "Tersimpan di HP ini");
      return true;
    }catch(e){
      setStorageStatus(false, "Gagal menyimpan di HP — pakai Backup Data");
      return false;
    }
  }
  setStorageStatus(false, "Penyimpanan tidak tersedia — pakai Backup Data");
  return false;
}

/* ---------- Render ---------- */
function sortedRecords(list){
  return [...list].sort((a,b)=>{
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });
}

/* ---------- Pencocokan filter ---------- */
function addDaysISO(iso, delta){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function matchesPeriod(r){
  if (appliedPeriods.size === 0) return true;
  const today = todayISO();
  const yesterday = addDaysISO(today, -1);
  const weekStart = addDaysISO(today, -6);
  const [ty, tm] = today.split('-');
  return [...appliedPeriods].some(p=>{
    if (p === 'today') return r.date === today;
    if (p === 'yesterday') return r.date === yesterday;
    if (p === 'week') return r.date >= weekStart && r.date <= today;
    if (p === 'month') return r.date.startsWith(`${ty}-${tm}`);
    return false;
  });
}
function matchesTime(r){
  if (appliedTimes.size === 0) return true;
  const d = new Date(r.createdAt);
  if (isNaN(d.getTime())) return false;
  const h = d.getHours();
  return [...appliedTimes].some(t=>{
    if (t === 'pagi') return h >= 0 && h < 12;
    if (t === 'siang') return h >= 12 && h < 18;
    if (t === 'malam') return h >= 18 && h < 24;
    return false;
  });
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const qDigits = digitsOnly(q);
  let filtered = records.filter(r=>{
    if (q){
      const unameMatch = r.username.toLowerCase().includes(q);
      const phoneMatch = qDigits && digitsOnly(r.phone).includes(qDigits);
      if (!unameMatch && !phoneMatch) return false;
    }
    if (!matchesPeriod(r)) return false;
    if (!matchesTime(r)) return false;
    return true;
  });
  const list = sortedRecords(filtered);
  const today = todayISO();

  document.getElementById('totalCount').textContent = records.length;

  const ledger = document.getElementById('ledger');
  const empty = document.getElementById('emptyState');

  if (records.length === 0){
    ledger.innerHTML = '';
    empty.hidden = false;
    empty.querySelector('p').textContent = 'Belum ada data tersimpan';
    empty.querySelector('p.sub').textContent = 'Ketuk "Tambah Data" untuk mencatat nomor HP pertama';
    return;
  }
  if (list.length === 0){
    ledger.innerHTML = '';
    empty.hidden = false;
    empty.querySelector('p').textContent = 'Tidak ditemukan';
    empty.querySelector('p.sub').textContent = 'Coba kata kunci atau filter lain';
    return;
  }
  empty.hidden = true;

  ledger.innerHTML = list.map((r, i)=>`
    <div class="row ${r.date === today ? 'today' : ''}" data-id="${r.id}">
      <div class="row-no">${String(list.length - i).padStart(3,'0')}</div>
      <div class="row-main">
        <div class="row-left">
          <div class="row-username">${escapeHtml(r.username)}</div>
          <div class="row-phone">${escapeHtml(r.phone)}</div>
        </div>
        <div class="row-when">
          <div class="row-date">${formatDateID(r.date)}</div>
          <div class="row-time">${formatTimeID(r.createdAt)}</div>
        </div>
      </div>
    </div>
  `).join('');

  ledger.querySelectorAll('.row').forEach(el=> attachLongPress(el, el.dataset.id));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Tekan lama (long press) ---------- */
function attachLongPress(el, id){
  let timer = null;
  let startX = 0, startY = 0;
  const THRESHOLD_MS = 450;
  const MOVE_TOLERANCE = 10;

  function start(x, y){
    startX = x; startY = y;
    clearTimeout(timer);
    timer = setTimeout(()=>{
      el.classList.add('pressed');
      if (navigator.vibrate) navigator.vibrate(12);
      openRowActions(id);
    }, THRESHOLD_MS);
  }
  function cancel(){
    clearTimeout(timer);
    el.classList.remove('pressed');
  }

  el.addEventListener('touchstart', e=>{
    const t = e.touches[0];
    start(t.clientX, t.clientY);
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    const t = e.touches[0];
    if (Math.abs(t.clientX-startX) > MOVE_TOLERANCE || Math.abs(t.clientY-startY) > MOVE_TOLERANCE) cancel();
  }, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);

  el.addEventListener('mousedown', e=> start(e.clientX, e.clientY));
  el.addEventListener('mousemove', e=>{
    if (Math.abs(e.clientX-startX) > MOVE_TOLERANCE || Math.abs(e.clientY-startY) > MOVE_TOLERANCE) cancel();
  });
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', e=> e.preventDefault());
}
function openRowActions(id){
  activeRowId = id;
  const rec = records.find(r=>r.id===id);
  document.getElementById('rowActionLabel').textContent = rec ? `${rec.username} — ${rec.phone}` : '';
  document.getElementById('rowActionOverlay').classList.add('show');
}
function closeRowActions(){
  document.getElementById('rowActionOverlay').classList.remove('show');
  document.querySelectorAll('.row.pressed').forEach(el=> el.classList.remove('pressed'));
}


/* ---------- Form (tambah / edit) ---------- */
function openForm(record){
  editingId = record ? record.id : null;
  document.getElementById('formTitle').textContent = record ? 'Edit Data' : 'Tambah Data';
  document.getElementById('saveRecordBtn').textContent = record ? 'Simpan Perubahan' : 'Simpan Data';
  document.getElementById('phoneInput').value = record ? record.phone : '';
  document.getElementById('usernameInput').value = record ? record.username : '';
  document.getElementById('dateInput').value = record ? record.date : todayISO();
  document.getElementById('formOverlay').classList.add('show');
  setTimeout(()=> document.getElementById('phoneInput').focus(), 150);
}
function closeForm(){
  document.getElementById('formOverlay').classList.remove('show');
  editingId = null;
}
async function handleSaveRecord(){
  const phone = document.getElementById('phoneInput').value.trim();
  const username = document.getElementById('usernameInput').value.trim();
  const date = document.getElementById('dateInput').value || todayISO();

  if (digitsOnly(phone).length < 8){
    toast('Nomor HP tidak valid, minimal 8 digit', 'error');
    return;
  }
  if (!username){
    toast('Username wajib diisi', 'error');
    return;
  }

  if (editingId){
    const rec = records.find(r=>r.id===editingId);
    if (rec){ rec.phone = phone; rec.username = username; rec.date = date; }
  } else {
    records.push({ id: uid(), phone, username, date, createdAt: new Date().toISOString() });
  }

  render();
  closeForm();
  const ok = await saveRecords();
  toast(ok ? 'Data disimpan' : 'Tersimpan di layar, backup otomatis gagal', ok ? 'success' : 'error');
}

/* ---------- Hapus ---------- */
function askDelete(id){
  pendingDeleteId = id;
  document.getElementById('confirmOverlay').classList.add('show');
}
async function confirmDelete(){
  document.getElementById('confirmOverlay').classList.remove('show');
  if (!pendingDeleteId) return;
  records = records.filter(r=>r.id !== pendingDeleteId);
  pendingDeleteId = null;
  render();
  const ok = await saveRecords();
  toast(ok ? 'Data dihapus' : 'Terhapus di layar, backup otomatis gagal', ok ? 'success' : 'error');
}

/* ---------- Backup JSON ---------- */
function backupJson(){
  if (records.length === 0){ toast('Belum ada data untuk dibackup', 'error'); return; }
  const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `buku-nomor-hp-backup-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Backup JSON diunduh');
}

/* ---------- Backup CSV ---------- */
function backupCsv(){
  if (records.length === 0){ toast('Belum ada data untuk dibackup', 'error'); return; }
  const list = sortedRecords(records);
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const rows = [['No','Username','Nomor HP','Tanggal'].map(esc).join(',')];
  list.forEach((r,i)=>{
    rows.push([list.length - i, r.username, r.phone, formatDateID(r.date)].map(esc).join(','));
  });
  const csv = '\uFEFF' + rows.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `buku-nomor-hp-${Date.now()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('File Excel (.csv) diunduh');
}

/* ---------- Backup PDF (cetak) ---------- */
function backupPdf(){
  if (records.length === 0){ toast('Belum ada data untuk dibackup', 'error'); return; }
  const list = sortedRecords(records);
  document.getElementById('printBody').innerHTML = list.map((r,i)=>`
    <tr>
      <td>${list.length - i}</td>
      <td>${escapeHtml(r.username)}</td>
      <td>${escapeHtml(r.phone)}</td>
      <td>${formatDateID(r.date)}</td>
    </tr>
  `).join('');
  window.print();
}

/* ---------- Import ---------- */
function importFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('format salah');
      const existingKeys = new Set(records.map(r=>`${digitsOnly(r.phone)}|${r.username.toLowerCase()}|${r.date}`));
      let added = 0;
      data.forEach(item=>{
        if (item && item.phone && item.username && item.date){
          const key = `${digitsOnly(item.phone)}|${String(item.username).toLowerCase()}|${item.date}`;
          if (!existingKeys.has(key)){
            records.push({
              id: uid(),
              phone: item.phone,
              username: item.username,
              date: item.date,
              createdAt: item.createdAt || new Date().toISOString()
            });
            existingKeys.add(key);
            added++;
          }
        }
      });
      render();
      const ok = await saveRecords();
      toast(added > 0 ? `${added} data dimasukkan` : 'Tidak ada data baru', (ok || added===0) ? 'success' : 'error');
    }catch(err){
      toast('File tidak valid', 'error');
    }
  };
  reader.readAsText(file);
}

/* ---------- Wire up UI ---------- */
document.getElementById('addBtn').addEventListener('click', ()=> openForm(null));
document.getElementById('cancelFormBtn').addEventListener('click', closeForm);
document.getElementById('formOverlay').addEventListener('click', (e)=>{ if (e.target.id==='formOverlay') closeForm(); });
document.getElementById('saveRecordBtn').addEventListener('click', handleSaveRecord);

document.getElementById('searchInput').addEventListener('input', render);

const menuOverlay = document.getElementById('menuOverlay');
document.getElementById('menuBtn').addEventListener('click', ()=> menuOverlay.classList.add('show'));
document.getElementById('closeMenuBtn').addEventListener('click', ()=> menuOverlay.classList.remove('show'));
menuOverlay.addEventListener('click', (e)=>{ if (e.target.id==='menuOverlay') menuOverlay.classList.remove('show'); });

document.getElementById('backupJsonBtn').addEventListener('click', ()=>{ backupJson(); menuOverlay.classList.remove('show'); });
document.getElementById('backupCsvBtn').addEventListener('click', ()=>{ backupCsv(); menuOverlay.classList.remove('show'); });
document.getElementById('backupPdfBtn').addEventListener('click', ()=>{ backupPdf(); menuOverlay.classList.remove('show'); });
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if (file) importFile(file);
  menuOverlay.classList.remove('show');
  e.target.value = '';
});

const confirmOverlay = document.getElementById('confirmOverlay');
document.getElementById('confirmCancelBtn').addEventListener('click', ()=>{ confirmOverlay.classList.remove('show'); pendingDeleteId = null; });
document.getElementById('confirmOkBtn').addEventListener('click', confirmDelete);

/* ---------- Row action sheet (tekan lama) ---------- */
async function copyToClipboard(text){
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
    throw new Error('no clipboard api');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e2){
      return false;
    }
  }
}
const rowActionOverlay = document.getElementById('rowActionOverlay');
document.getElementById('rowActionCancelBtn').addEventListener('click', closeRowActions);
rowActionOverlay.addEventListener('click', (e)=>{ if (e.target.id==='rowActionOverlay') closeRowActions(); });
document.getElementById('rowCopyUsernameBtn').addEventListener('click', async ()=>{
  const rec = records.find(r=>r.id===activeRowId);
  closeRowActions();
  if (!rec) return;
  const ok = await copyToClipboard(rec.username);
  toast(ok ? 'Username disalin' : 'Gagal menyalin', ok ? 'success' : 'error');
});
document.getElementById('rowCopyPhoneBtn').addEventListener('click', async ()=>{
  const rec = records.find(r=>r.id===activeRowId);
  closeRowActions();
  if (!rec) return;
  const ok = await copyToClipboard(rec.phone);
  toast(ok ? 'Nomor HP disalin' : 'Gagal menyalin', ok ? 'success' : 'error');
});
document.getElementById('rowEditBtn').addEventListener('click', ()=>{
  const rec = records.find(r=>r.id===activeRowId);
  closeRowActions();
  if (rec) openForm(rec);
});
document.getElementById('rowDeleteBtn').addEventListener('click', ()=>{
  const id = activeRowId;
  closeRowActions();
  askDelete(id);
});

/* ---------- Filter sheet ---------- */
function renderFilterChips(){
  const periodWrap = document.getElementById('periodChips');
  periodWrap.innerHTML = PERIOD_OPTIONS.map(o=>`
    <div class="filter-chip ${selectedPeriods.has(o.id) ? 'checked' : ''}" data-group="period" data-id="${o.id}">
      <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
      ${o.label}
    </div>
  `).join('');
  const timeWrap = document.getElementById('timeChips');
  timeWrap.innerHTML = TIME_OPTIONS.map(o=>`
    <div class="filter-chip ${selectedTimes.has(o.id) ? 'checked' : ''}" data-group="time" data-id="${o.id}">
      <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
      ${o.label}
    </div>
  `).join('');
  document.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const set = chip.dataset.group === 'period' ? selectedPeriods : selectedTimes;
      const id = chip.dataset.id;
      if (set.has(id)) set.delete(id); else set.add(id);
      chip.classList.toggle('checked');
    });
  });
}
function updateFilterBadge(){
  const count = appliedPeriods.size + appliedTimes.size;
  const badge = document.getElementById('filterBadge');
  const btn = document.getElementById('filterBtn');
  if (count > 0){
    badge.hidden = false;
    badge.textContent = count;
    btn.classList.add('active');
  } else {
    badge.hidden = true;
    btn.classList.remove('active');
  }
}
const filterOverlay = document.getElementById('filterOverlay');
document.getElementById('filterBtn').addEventListener('click', ()=>{
  selectedPeriods = new Set(appliedPeriods);
  selectedTimes = new Set(appliedTimes);
  renderFilterChips();
  filterOverlay.classList.add('show');
});
filterOverlay.addEventListener('click', (e)=>{ if (e.target.id==='filterOverlay') filterOverlay.classList.remove('show'); });
document.getElementById('applyFilterBtn').addEventListener('click', ()=>{
  appliedPeriods = new Set(selectedPeriods);
  appliedTimes = new Set(selectedTimes);
  updateFilterBadge();
  render();
  filterOverlay.classList.remove('show');
});
document.getElementById('resetFilterBtn').addEventListener('click', ()=>{
  selectedPeriods = new Set();
  selectedTimes = new Set();
  appliedPeriods = new Set();
  appliedTimes = new Set();
  renderFilterChips();
  updateFilterBadge();
  render();
});

/* ---------- Init ---------- */
(async function init(){
  await loadRecords();
  render();
})();

/* ---------- Daftarkan service worker (syarat wajib biar tombol "Install app" muncul) ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch((err) => {
      console.error("Gagal mendaftarkan service worker:", err);
    });
  });
}
